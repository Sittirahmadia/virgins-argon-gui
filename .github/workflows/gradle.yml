name: Build and Upload Jar

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2G -Dfile.encoding=UTF-8"

      - name: Upload runnable jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: virgins-argon-gui-jar-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload sources jar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virgins-argon-gui-sources-${{ github.sha }}
          path: build/libs/*-sources.jar
          if-no-files-found: ignore
          retention-days: 30
